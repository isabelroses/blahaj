[package]
name = "blahaj"
version = "0.3.0"
license = "MIT"
authors = ["isabel roses <isabel@isabelroses.com>"]
description = "the resident discord bot of :3"
readme = "README.md"
homepage = "https://github.com/isabelroses/blahaj"
repository = "https://github.com/isabelroses/blahaj"
keywords = ["bot", "discord", "serenity"]
edition = "2024"

[dependencies]
base64 = "0.23.0"
bottomify = "1.2.0"
brotli = "8.0.4"
chrono = "0.4.45"
chrono-tz = "0.10.4"
color-eyre = "0.6.5"
confique = { version = "0.4.0", features = ["toml"] }
dotenv = "0.15.0"
humantime = "2.4.0"
kittycore = "0.1.1"
nixpkgs-track_lib = "0.5.0"
poise = "0.6.2"
rand = "0.10.2"
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde_json = "1.0.149"
serenity = "0.12.5"
sha2 = "0.11.0"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts"] }

[dependencies.reqwest]
version = "0.12.12"
features = ["json"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.tokio]
version = "1.53.1"
features = ["macros", "rt-multi-thread"]

[lints.clippy]
all = "warn"
pedantic = "warn"
unreadable_literal = { level = "allow", priority = 1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
